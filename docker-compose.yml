# Arquitectura completa: MySQL + 5 microservicios + API Gateway.
# Requisito: archivo .env con los secretos (ejecute .\setup-env.ps1 o copie .env.example a .env).
# Sólo el gateway (8080) queda accesible desde fuera; los microservicios viven en la red interna.

x-microservicio: &microservicio
  restart: unless-stopped
  networks: [pchw-net]
  depends_on:
    mysql:
      condition: service_healthy

x-entorno-comun: &entorno-comun
  # Hora de Chile para las fechas que generan los servicios (boletas, historial de usuarios).
  # Sin esto la JVM del contenedor usa UTC y las fechas se ven 3 horas adelantadas.
  TZ: America/Santiago
  SPRING_PROFILES_ACTIVE: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: pchw
  DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env (ver .env.example)}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Defina INTERNAL_API_KEY en .env (ver .env.example)}

services:
  mysql:
    image: mysql:8.4
    container_name: pchw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env (ver .env.example)}
      MYSQL_USER: pchw
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env (ver .env.example)}
      TZ: America/Santiago
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Sólo en la máquina local (para revisar la BD con MySQL Workbench / DBeaver en el puerto 3307).
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [pchw-net]

  usuario-service:
    <<: *microservicio
    build: ./usuario-service
    container_name: pchw-usuario-service
    environment:
      <<: *entorno-comun
    expose: ["8081"]

  categoria-service:
    <<: *microservicio
    build: ./categoria-service
    container_name: pchw-categoria-service
    environment:
      <<: *entorno-comun
      SERVICES_PRODUCTO_URL: http://producto-service:8083
    expose: ["8082"]

  producto-service:
    <<: *microservicio
    build: ./producto-service
    container_name: pchw-producto-service
    environment:
      <<: *entorno-comun
      SERVICES_CATEGORIA_URL: http://categoria-service:8082
    expose: ["8083"]

  boleta-service:
    <<: *microservicio
    build: ./boleta-service
    container_name: pchw-boleta-service
    environment:
      <<: *entorno-comun
      SERVICES_PRODUCTO_URL: http://producto-service:8083
      SERVICES_DETALLE_URL: http://detalle-service:8085
    expose: ["8084"]

  detalle-service:
    <<: *microservicio
    build: ./detalle-service
    container_name: pchw-detalle-service
    environment:
      <<: *entorno-comun
    expose: ["8085"]

  gateway-api:
    <<: *microservicio
    build: ./gateway-api
    container_name: pchw-gateway-api
    environment:
      <<: *entorno-comun
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (ver .env.example)}
      SERVICES_USUARIO_URL: http://usuario-service:8081
      SERVICES_CATEGORIA_URL: http://categoria-service:8082
      SERVICES_PRODUCTO_URL: http://producto-service:8083
      SERVICES_BOLETA_URL: http://boleta-service:8084
      SERVICES_DETALLE_URL: http://detalle-service:8085
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      usuario-service:
        condition: service_started
      categoria-service:
        condition: service_started
      producto-service:
        condition: service_started
      boleta-service:
        condition: service_started
      detalle-service:
        condition: service_started

volumes:
  mysql-data:

networks:
  pchw-net:
    driver: bridge
