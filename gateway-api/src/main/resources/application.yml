server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: gateway-api
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

# Tokens de sesión. El secreto es obligatorio y se entrega por variable de entorno (ver .env.example).
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}             # access token: 1 hora
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # refresh token: 7 días

# Clave compartida con los microservicios (cabecera X-Internal-Token).
internal:
  api-key: ${INTERNAL_API_KEY:}

# URLs de los microservicios (en Docker se sobreescriben con variables SERVICES_*).
services:
  usuario-url: http://localhost:8081
  categoria-url: http://localhost:8082
  producto-url: http://localhost:8083
  boleta-url: http://localhost:8084
  detalle-url: http://localhost:8085

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
# Desarrollo local: refresh tokens en H2 en memoria.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:gatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

---
# MySQL (docker-compose): los refresh tokens sobreviven a reinicios.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pchw_gateway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:pchw}
    password: ${DB_PASSWORD:}
