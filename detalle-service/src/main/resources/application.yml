server:
  port: 8085
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: detalle-service
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

# Clave compartida que sólo conocen el gateway y los microservicios (cabecera X-Internal-Token).
# Obligatoria: se define con la variable de entorno INTERNAL_API_KEY (ver .env.example).
internal:
  api-key: ${INTERNAL_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Perfil de desarrollo local: base H2 en memoria (los datos se pierden al reiniciar).
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:detalledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

---
# Perfil MySQL (usado por docker-compose): base persistente, credenciales por variables de entorno.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pchw_detalles?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:pchw}
    password: ${DB_PASSWORD:}
